apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-backend
  namespace: erp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-backend
  template:
    metadata:
      labels:
        app: erp-backend
    spec:
      containers:
      - env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://erp-postgres-rw.erp-postgres.svc.cluster.local:5432/blue_postgres
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: erp-backend-db
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: erp-backend-db
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
          value: https://bluesolution.es/iam/realms/railway
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
          value: http://erp-keycloak-service.keycloak.svc.cluster.local:8080/iam/realms/railway/protocol/openid-connect/certs
        - name: KEYCLOAK_ADMIN_CLIENT_AUTH_SERVER_URL
          value: http://erp-keycloak-service.keycloak.svc.cluster.local:8080/iam
        - name: KEYCLOAK_ADMIN_CLIENT_REALM
          value: railway
        - name: KEYCLOAK_IAM_CLIENT_AUTH_SERVER_URL
          value: http://erp-keycloak-service.keycloak.svc.cluster.local:8080/iam
        - name: KEYCLOAK_IAM_CLIENT_REALM
          value: railway
        - name: KEYCLOAK_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: admin-client-secret
              name: erp-backend-keycloak
              optional: true
        - name: KEYCLOAK_IAM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: iam-client-secret
              name: erp-backend-keycloak
              optional: true
        image: ghcr.io/javier-godon/erp-backend:v0.1.0-0d2a16e-20261101-1306
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: 9090
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: erp-backend
        ports:
        - containerPort: 8089
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: 9090
          initialDelaySeconds: 0
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: '2'
            memory: 1536Mi
          requests:
            cpu: 250m
            memory: 768Mi
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /actuator/health
            port: 9090
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
      serviceAccountName: erp-backend-sa
---
apiVersion: v1
kind: Service
metadata:
  name: erp-backend
  namespace: erp-backend
spec:
  ports:
  - port: 8089
  selector:
    app: erp-backend
  type: ClusterIP
---
apiVersion: v1
imagePullSecrets:
- name: ghcr-secret
kind: ServiceAccount
metadata:
  name: erp-backend-sa
  namespace: erp-backend
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: erp-backend
  namespace: erp-backend
  labels:
    app: erp-backend
spec:
  ingressClassName: apisix
  http:
  - name: erp-backend
    match:
      paths:
      - /api
      - /api/*
    backends:
    - serviceName: erp-backend
      servicePort: 8089
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - ^/api/?(.*)
        - /shopping/$1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-owner-admin
  namespace: erp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-owner-admin
  template:
    metadata:
      labels:
        app: erp-owner-admin
    spec:
      containers:
      - env:
        - name: NUXT_APP_BASE_URL
          value: /owner/
        - name: NUXT_PUBLIC_APP_ORIGIN
          value: https://bluesolution.es
        - name: NUXT_ERP_API_BASE_URL
          value: http://erp-backend.erp-backend.svc.cluster.local:8089/shopping
        - name: NUXT_OIDC_ISSUER
          value: https://bluesolution.es/iam/realms/railway
        - name: NUXT_OIDC_CLIENT_ID
          value: erp-owner-admin-bff
        - name: NUXT_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: oidc-client-secret
              name: erp-owner-admin
        - name: NUXT_OIDC_REDIRECT_URI
          value: https://bluesolution.es/owner/auth/callback
        - name: NUXT_OIDC_POST_LOGOUT_REDIRECT_URI
          value: https://bluesolution.es/owner/
        - name: NUXT_APP_SECRET
          valueFrom:
            secretKeyRef:
              key: app-secret
              name: erp-owner-admin
        - name: NUXT_SESSION_STORAGE_URL
          value: redis://erp-cache.erp-data.svc.cluster.local:6379
        - name: NUXT_TRUSTED_PROXY_HOPS
          value: '1'
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/platform-ca/ca.crt
        image: ghcr.io/javier-godon/erp-owner-admin-interface:v0.1.0-d35d313-20261101-1340
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /owner/healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: erp-owner-admin
        ports:
        - containerPort: 3000
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /owner/healthz
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /etc/platform-ca
          name: platform-ca
          readOnly: true
      volumes:
      - configMap:
          name: platform-ca
          optional: true
        name: platform-ca
---
apiVersion: v1
kind: Service
metadata:
  name: erp-owner-admin
  namespace: erp-backend
spec:
  ports:
  - port: 3000
  selector:
    app: erp-owner-admin
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: erp-owner-admin
  namespace: erp-backend
  labels:
    app: erp-owner-admin
spec:
  parentRefs:
  - name: platform-gateway
    namespace: gateway-system
    sectionName: https
  hostnames:
  - bluesolution.es
  rules:
  - matches:
    - path:
        type: Exact
        value: /owner
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /owner/
        statusCode: 301
  - matches:
    - path:
        type: PathPrefix
        value: /owner
    backendRefs:
    - name: erp-owner-admin
      port: 3000
---
