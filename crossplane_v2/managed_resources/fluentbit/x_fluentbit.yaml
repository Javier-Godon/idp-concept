## Fluent Bit Composition — Kubernetes-native Deployment/DaemonSet pattern
##
## Fluent Bit has no operator; we deploy it as native K8s resources.
## Supports both single-instance (Deployment) and node-wide (DaemonSet) modes.
##
## function-kcl renders exactly one of Deployment/DaemonSet based on spec.mode
## (function-patch-and-transform has no mechanism to conditionally exclude a resource).
## function-auto-ready must run before function-sequencer; see function-sequencer's own
## reference composition.

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xfluentbitinstance-native-composition
  annotations:
    koncept.io/deployment-method: "kubernetes-native"
    koncept.io/pattern: "deployment-native"
spec:
  compositeTypeRef:
    apiVersion: koncept.bluesolution.es/v1alpha1
    kind: XFluentBitInstance
  mode: Pipeline
  pipeline:

    - step: render-resources
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            _oxr = option("params").oxr
            _ox = _oxr.spec
            _name = _oxr.metadata.name

            _labels = {
                app = "fluentbit"
                "koncept.io/managed-by" = "crossplane"
            }

            _wrap = lambda name: str, manifest: {str:} -> {str:} {
                {
                    apiVersion = "kubernetes.crossplane.io/v1alpha2"
                    kind = "Object"
                    metadata.annotations = {
                        "krm.kcl.dev/composition-resource-name" = name
                    }
                    spec = {
                        providerConfigRef.name = "provider-kubernetes"
                        forProvider.manifest = manifest
                    }
                }
            }

            _default_config = """[SERVICE]
                Daemon              Off
                Flush               5
                Log_Level           info
                Parsers_File        parsers.conf
                HTTP_Server         On
                HTTP_Listen         0.0.0.0
                HTTP_Port           2020
                HC_Errors           On
                HC_Period           60

            [INPUT]
                Name                systemd
                Tag                 host.*
                Path                /var/log/journal
                Read_From_Tail      On

            [OUTPUT]
                Name                stdout
                Match               *
            """

            _namespace = _wrap("ns-fluentbit", {
                apiVersion = "v1"
                kind = "Namespace"
                metadata = {
                    name = _ox.namespace
                    labels = {
                        "koncept.io/managed-by" = "crossplane"
                        "koncept.io/owner" = _ox.owner
                    }
                }
            })

            _configmap = _wrap("fluentbit-configmap", {
                apiVersion = "v1"
                kind = "ConfigMap"
                metadata = {
                    name = "fluentbit-config"
                    namespace = _ox.namespace
                    labels = _labels
                }
                data = {
                    "fluent-bit.conf" = _ox.configData if _ox.configData else _default_config
                }
            })

            _container = {
                name = "fluent-bit"
                image = "${_ox.image}:${_ox.version}"
                imagePullPolicy = "IfNotPresent"
                ports = [{ containerPort = _ox.metricsPort, name = "metrics" }]
                resources = {
                    requests = {
                        cpu = _ox.resourceCpuRequest
                        memory = _ox.resourceMemoryRequest
                    }
                    limits = {
                        cpu = _ox.resourceCpuLimit
                        memory = _ox.resourceMemoryLimit
                    }
                }
            }

            _deployment = _wrap("fluentbit-deployment", {
                apiVersion = "apps/v1"
                kind = "Deployment"
                metadata = {
                    name = _name
                    namespace = _ox.namespace
                    labels = _labels
                }
                spec = {
                    replicas = _ox.replicas
                    selector.matchLabels = _labels
                    template = {
                        metadata.labels = _labels
                        spec = {
                            containers = [_container | {
                                volumeMounts = [{ name = "config", mountPath = "/fluent-bit/etc/" }]
                            }]
                            volumes = [{ name = "config", configMap.name = "fluentbit-config" }]
                        }
                    }
                }
            }) if _ox.mode == "deployment" else None

            _daemonset = _wrap("fluentbit-daemonset", {
                apiVersion = "apps/v1"
                kind = "DaemonSet"
                metadata = {
                    name = _name
                    namespace = _ox.namespace
                    labels = _labels
                }
                spec = {
                    selector.matchLabels = _labels
                    template = {
                        metadata.labels = _labels
                        spec = {
                            containers = [_container | {
                                volumeMounts = [
                                    { name = "config", mountPath = "/fluent-bit/etc/" }
                                    { name = "varlog", mountPath = "/var/log", readOnly = True }
                                    { name = "varlibdockercontainers", mountPath = "/var/lib/docker/containers", readOnly = True }
                                ]
                            }]
                            volumes = [
                                { name = "config", configMap.name = "fluentbit-config" }
                                { name = "varlog", hostPath.path = "/var/log" }
                                { name = "varlibdockercontainers", hostPath.path = "/var/lib/docker/containers" }
                            ]
                        }
                    }
                }
            }) if _ox.mode == "daemonset" else None

            _service = _wrap("fluentbit-service", {
                apiVersion = "v1"
                kind = "Service"
                metadata = {
                    name = "fluentbit"
                    namespace = _ox.namespace
                    labels = _labels
                }
                spec = {
                    $type = _ox.serviceType
                    selector = _labels
                    ports = [{ port = _ox.metricsPort, targetPort = _ox.metricsPort, name = "metrics" }]
                }
            })

            items = [r for r in [_namespace, _configmap, _deployment, _daemonset, _service] if r is not None]

    - step: automatically-detect-readiness
      functionRef:
        name: function-auto-ready

    - step: sequence-creation
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        rules:
          - sequence:
              - ns-fluentbit
              - fluentbit-configmap
          - sequence:
              - fluentbit-configmap
              - fluentbit-deployment
          - sequence:
              - fluentbit-configmap
              - fluentbit-daemonset
          - sequence:
              - ns-fluentbit
              - fluentbit-service
