## Redis Composition — OT-CONTAINER-KIT Redis Operator pattern
##
## Prerequisite: OT-CONTAINER-KIT Redis Operator must be installed on the cluster.
## Install via Helm: helm repo add ot-helm https://ot-container-kit.github.io/helm-charts
##                  helm install redis-operator ot-helm/redis-operator -n redis-operator --create-namespace
## Note: OT-CONTAINER-KIT/redis-operator is actively maintained (verify via
## github.com/OT-CONTAINER-KIT/redis-operator releases / quay.io/opstree/redis-operator tags —
## its Docker Hub mirror is a stale, abandoned registry the project stopped publishing to).
##
## This composition uses:
##   - provider-kubernetes Object for the Namespace (small cluster glue, acceptable per patterns)
##   - provider-kubernetes Object for Redis/RedisCluster CRD (operator-native resources)
##   - function-kcl to render exactly one Redis/RedisCluster variant based on spec.mode
##     (function-patch-and-transform has no mechanism to conditionally exclude a resource)
##   - function-sequencer to ensure namespace is ready before Redis resources are created
##   - function-auto-ready for composite readiness detection (must run before function-sequencer;
##     see function-sequencer's own reference composition)

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xredisinstance-operator-composition
  annotations:
    koncept.io/operator: "ot-redis"
    koncept.io/pattern: "operator-native-crd"
    koncept.io/bridge-pattern: "false"
spec:
  compositeTypeRef:
    apiVersion: koncept.bluesolution.es/v1alpha1
    kind: XRedisInstance
  mode: Pipeline
  pipeline:

    # Step 1: Create all composed resources (namespace + exactly one of Redis/RedisCluster)
    - step: render-resources
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            _oxr = option("params").oxr
            _ox = _oxr.spec
            _base_name = _ox.clusterName if _ox.clusterName else _oxr.metadata.name

            _labels = {
                "koncept.io/managed-by" = "crossplane"
                "koncept.io/owner" = _ox.owner
            }

            _wrap = lambda name: str, manifest: {str:} -> {str:} {
                {
                    apiVersion = "kubernetes.crossplane.io/v1alpha2"
                    kind = "Object"
                    metadata.annotations = {
                        "krm.kcl.dev/composition-resource-name" = name
                    }
                    spec = {
                        providerConfigRef.name = "provider-kubernetes"
                        forProvider.manifest = manifest
                    }
                }
            }

            _namespace = _wrap("ns-redis", {
                apiVersion = "v1"
                kind = "Namespace"
                metadata = {
                    name = _ox.namespace
                    labels = _labels
                }
            })

            _resources_spec = {
                requests = {
                    cpu = _ox.resourceCpuRequest
                    memory = _ox.resourceMemoryRequest
                }
                limits = {
                    cpu = _ox.resourceCpuLimit
                    memory = _ox.resourceMemoryLimit
                }
            }

            _vct_spec = {
                accessModes = ["ReadWriteOnce"]
                resources = {
                    requests = {
                        storage = _ox.storageSize
                    }
                }
            } | ({storageClassName = _ox.storageClass} if _ox.storageClass else {})

            _standalone = _wrap("redis-standalone", {
                apiVersion = "redis.redis.opstreelabs.in/v1beta2"
                kind = "Redis"
                metadata = {
                    name = _base_name
                    namespace = _ox.namespace
                    labels = _labels
                }
                spec = {
                    image = _ox.image
                    storage.image.tag = "latest"
                    volumeClaimTemplate.spec = _vct_spec
                    resources = _resources_spec
                }
            }) if _ox.mode == "standalone" else None

            _cluster = _wrap("redis-cluster", {
                apiVersion = "redis.redis.opstreelabs.in/v1beta2"
                kind = "RedisCluster"
                metadata = {
                    name = "${_base_name}-cluster"
                    namespace = _ox.namespace
                    labels = _labels
                }
                spec = {
                    image = _ox.image
                    clusterSize = _ox.nodeCount
                    volumeClaimTemplate.spec = _vct_spec
                    resources = _resources_spec
                }
            }) if _ox.mode == "cluster" else None

            items = [r for r in [_namespace, _standalone, _cluster] if r is not None]

    # Step 2: Detect readiness so function-sequencer can see whether ns-redis is ready
    - step: automatically-detect-readiness
      functionRef:
        name: function-auto-ready

    # Step 3: Enforce namespace-before-redis creation order
    - step: sequence-creation
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        rules:
          - sequence:
              - ns-redis
              - redis-standalone
          - sequence:
              - ns-redis
              - redis-cluster
