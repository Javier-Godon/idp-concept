## XGateway examples
---
## Local cluster (minikube/kind): listen on the node IP, local CA for TLS.
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XGateway
metadata:
  name: platform-gateway
spec:
  addresses: ["192.168.49.2"]
  serviceType: NodePort
  replicas: 1
  tls:
    hostnames: ["bluesolution.es"]
    selfSignedCA: true
  environment: local
  owner: platform-team
---
## Production: cloud LoadBalancer, certificates from an existing ACME ClusterIssuer.
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XGateway
metadata:
  name: public-gateway
spec:
  replicas: 3
  allowedRoutes: All
  tls:
    hostnames: ["bluesolution.es", "www.bluesolution.es"]
    issuerRef:
      name: letsencrypt-prod
  environment: production
  owner: platform-team
