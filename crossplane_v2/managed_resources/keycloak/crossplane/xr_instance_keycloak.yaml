---
# Production XR — platform team deploys cluster-scoped. Served at https://bluesolution.es/iam
# `namespace` is the keycloak-operator namespace; the db Secret (username/password) must exist there.
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XKeycloak
metadata:
  name: blue-keycloak
  labels:
    koncept.io/environment: production
    koncept.io/owner: platform-team
spec:
  hostname: bluesolution.es
  namespace: keycloak
  instances: 2
  db:
    host: blue-postgres-cluster-rw.postgres.svc.cluster.local
    database: keycloak
    vendor: postgres
    secretRef:
      name: keycloak-db-credentials
  route:
    listener: https
    path: /iam
  environment: production
  owner: platform-team

---
# Development XR — single instance, plain HTTP listener, served at the root of its own hostname.
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XKeycloak
metadata:
  name: dev-keycloak
  labels:
    koncept.io/environment: development
    koncept.io/owner: team-alpha
spec:
  hostname: keycloak-dev.example.com
  namespace: keycloak-dev
  instances: 1
  db:
    host: dev-postgres-cluster-rw.postgres-dev.svc.cluster.local
    database: keycloak_dev
    vendor: postgres
    secretRef:
      name: keycloak-dev-db-credentials
  route:
    listener: http
  environment: development
  owner: team-alpha
