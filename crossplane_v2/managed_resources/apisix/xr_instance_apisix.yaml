## Example XAPIGateway instance (local dev, published on the platform gateway).
## The XR is normally rendered by `koncept render crossplane` (projects/erp); see
## docs/platform-engineering/API_GATEWAY_VS_GATEWAY_API.md.
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XAPIGateway
metadata:
  name: erp-apisix
spec:
  namespace: apisix
  releaseName: erp-apisix
  chartVersion: "2.18.0"
  replicas: 1
  adminKeySecretName: apisix-admin-keys
  adminAllowCidrs:
    - 10.244.0.0/16
  etcd:
    replicas: 1
    storageSize: 2Gi
    storageClass: local-path
    imageTag: 3.6.4-debian-12-r4
  publish:
    hostname: bluesolution.es
    listener: https
    proxyPath: /api
    uiEntryPath: /apisix
  environment: development
