apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xapigateways.koncept.bluesolution.es
  annotations:
    koncept.io/tier: "2"
    koncept.io/deployment-method: "helm"
    koncept.io/chart: "apisix/apisix"
    koncept.io/chart-version: "2.18.0"
    koncept.io/operator: "apache-apisix-ingress-controller"
    koncept.io/last-reviewed: "2026-10-12"
    koncept.io/note: "Apache APISIX 3.19 API gateway with the embedded Admin UI and the Apache apisix-ingress-controller (ApisixRoute CRs). Complements, not replaces, the Gateway API edge (Envoy Gateway). The bundled etcd is development/testing only."
spec:
  scope: Cluster
  group: koncept.bluesolution.es
  names:
    kind: XAPIGateway
    plural: xapigateways
  defaultCompositionRef:
    name: xapigateway-helm-composition
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: NAMESPACE
          type: string
          jsonPath: .spec.namespace
        - name: CHART
          type: string
          jsonPath: .spec.chartVersion
        - name: PROXY
          type: string
          jsonPath: .status.proxyUrl
        - name: UI
          type: string
          jsonPath: .status.adminUiUrl
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: Apache APISIX API gateway (Helm chart) with etcd, the Admin UI and the ingress-controller operator.
              required:
                - namespace
                - adminKeySecretName
              x-kubernetes-validations:
                - rule: "self.releaseName.contains('apisix')"
                  message: "releaseName must contain 'apisix' so the chart Services are <releaseName>-gateway and <releaseName>-admin"
              properties:
                namespace:
                  type: string
                  description: Namespace of the APISIX release (created by the composition).
                releaseName:
                  type: string
                  description: Helm release name; must contain "apisix".
                  default: apisix
                  pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                chartVersion:
                  type: string
                  description: Pinned apisix/apisix chart version (2.18.0 ships APISIX 3.19.0).
                  default: "2.18.0"
                  pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
                replicas:
                  type: integer
                  description: APISIX data-plane replicas.
                  default: 1
                  minimum: 1
                  maximum: 10
                adminKeySecretName:
                  type: string
                  description: >-
                    Secret in the APISIX namespace with keys `admin` and `viewer` holding the Admin API keys.
                    Created out of band and never rendered; the public chart default key must not be used.
                adminAllowCidrs:
                  type: array
                  description: Client CIDRs allowed to reach the Admin API / UI (pod network of Envoy Gateway and the ingress controller).
                  items:
                    type: string
                    pattern: "^[0-9a-fA-F:.]+/[0-9]+$"
                  default:
                    - 10.244.0.0/16
                gatewayType:
                  type: string
                  description: Service type of the APISIX data plane (ClusterIP when published through Envoy Gateway).
                  enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                  default: ClusterIP
                ingressController:
                  type: boolean
                  description: Install the Apache apisix-ingress-controller so routes are declared as ApisixRoute CRs.
                  default: true
                etcd:
                  type: object
                  description: Bundled etcd (development/testing; prefer an external etcd in production).
                  default: {}
                  properties:
                    replicas:
                      type: integer
                      default: 1
                      minimum: 1
                      maximum: 5
                    storageSize:
                      type: string
                      default: "2Gi"
                      pattern: "^[0-9]+(Mi|Gi|Ti)$"
                    storageClass:
                      type: string
                      description: StorageClass of the etcd PVCs (empty = cluster default). Local clusters use local-path; production uses the Ceph block class.
                      default: ""
                    imageTag:
                      type: string
                      description: Pinned bitnamilegacy/etcd tag (the chart default is `latest`).
                      default: "3.6.4-debian-12-r4"
                      pattern: "^[a-zA-Z0-9._-]+$"
                publish:
                  type: object
                  description: >-
                    Publish APISIX on the platform gateway (Gateway API). `proxyPath` forwards to the data plane;
                    `/ui` and `/apisix/admin` forward to the Admin UI/API; `uiEntryPath` redirects to /ui/.
                    Omit to keep APISIX cluster-internal.
                  required:
                    - hostname
                  properties:
                    hostname:
                      type: string
                      pattern: "^[a-zA-Z0-9.-]+$"
                    listener:
                      type: string
                      enum:
                        - https
                        - http
                      default: https
                    gatewayName:
                      type: string
                      default: platform-gateway
                    gatewayNamespace:
                      type: string
                      default: gateway-system
                    proxyPath:
                      type: string
                      description: Path prefix forwarded to the APISIX data plane.
                      default: /api
                      pattern: "^/[a-zA-Z0-9._~-]+(/[a-zA-Z0-9._~-]+)*$"
                    uiEntryPath:
                      type: string
                      description: Friendly entry point redirected to /ui/.
                      default: /apisix
                      pattern: "^/[a-zA-Z0-9._~-]+(/[a-zA-Z0-9._~-]+)*$"
                environment:
                  type: string
                  description: Deployment footprint label.
                  default: development
                owner:
                  type: string
                  default: ""
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                proxyUrl:
                  type: string
                  description: Public URL prefix of the APISIX data plane (empty when not published).
                adminUiUrl:
                  type: string
                  description: Public URL of the APISIX Admin UI (empty when not published).
                gatewayService:
                  type: string
                  description: In-cluster data-plane Service endpoint.
