## Observability Composition — Prometheus + Grafana + Alertmanager via FluxCD HelmRelease
##
## Prerequisite: FluxCD source-controller + helm-controller must be installed, with a
## HelmRepository named "bitnami" in crossplane-system providing the referenced charts.
##
## function-kcl renders exactly the HelmRelease resources whose toggle is enabled
## (prometheusEnabled / grafanaEnabled / alertmanagerEnabled) — function-patch-and-transform
## has no mechanism to conditionally exclude a resource, so previously all three releases were
## always created regardless of their toggle (e.g. Alertmanager deployed even though disabled
## by default).

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xobservabilityprovisioner-helm-composition
  labels:
    koncept.io/version: "v1alpha1"
    koncept.io/pattern: "helm-composite"
spec:
  compositeTypeRef:
    apiVersion: koncept.bluesolution.es/v1alpha1
    kind: XObservabilityProvisioner
  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            _oxr = option("params").oxr
            _ox = _oxr.spec
            _release_name = _ox.releaseName if _ox.releaseName else _oxr.metadata.name

            _mark = lambda name: str, manifest: {str:} -> {str:} {
                manifest | {
                    metadata.annotations = {
                        "krm.kcl.dev/composition-resource-name" = name
                    }
                }
            }

            _namespace = _mark("namespace", {
                apiVersion = "v1"
                kind = "Namespace"
                metadata = {
                    name = _ox.namespace
                    labels = {
                        "app.kubernetes.io/managed-by" = "crossplane"
                        "app.kubernetes.io/component" = "observability-infrastructure"
                    }
                }
            })

            _helm_release = lambda name: str, component: str, chart: str, version: str, values: {str:} -> {str:} {
                _mark(name, {
                    apiVersion = "helm.toolkit.fluxcd.io/v2beta1"
                    kind = "HelmRelease"
                    metadata = {
                        name = "${_release_name}-${component}"
                        namespace = _ox.namespace
                        labels = {
                            "app.kubernetes.io/component" = component
                            "app.kubernetes.io/managed-by" = "crossplane"
                        }
                    }
                    spec = {
                        interval = "5m"
                        chart.spec = {
                            chart = chart
                            sourceRef = { kind = "HelmRepository", name = "bitnami", namespace = "crossplane-system" }
                            version = version
                        }
                        values = values
                    }
                })
            }

            _prometheus = _helm_release("prometheus-release", "prometheus", "kube-prometheus", _ox.prometheusChartVersion, {
                prometheus = {
                    persistence = {
                        enabled = True
                        size = _ox.prometheusStorageSize
                        storageClassName = "rook-ceph-block"
                    }
                    retention = "${_ox.prometheusRetentionDays}d"
                    replicas = 1
                    resources = {
                        requests = { cpu = "500m", memory = "512Mi" }
                        limits = { cpu = "1000m", memory = "1Gi" }
                    }
                }
                nodeExporter.enabled = _ox.nodeExporterEnabled
                alertmanager.enabled = False
                kubeStateMetrics.enabled = True
            }) if _ox.prometheusEnabled else None

            _grafana = _helm_release("grafana-release", "grafana", "grafana", _ox.grafanaChartVersion, {
                admin.password = _ox.grafanaAdminPassword
                persistence = {
                    enabled = True
                    size = "10Gi"
                    storageClassName = "rook-ceph-block"
                }
                datasources.prometheus = {
                    enabled = True
                    url = "http://prometheus-kube-prometheus-prometheus:9090"
                }
                resources = {
                    requests = { cpu = "250m", memory = "256Mi" }
                    limits = { cpu = "500m", memory = "512Mi" }
                }
            }) if _ox.grafanaEnabled else None

            _grafana_hosts = _ox.grafanaRoute?.hostnames or []
            _grafana_route = _mark("grafana-route", {
                apiVersion = "gateway.networking.k8s.io/v1"
                kind = "HTTPRoute"
                metadata = {
                    name = "${_release_name}-grafana"
                    namespace = _ox.namespace
                    labels = {"app.kubernetes.io/managed-by" = "crossplane"}
                }
                spec = {
                    parentRefs = [{
                        name = _ox.grafanaRoute.gatewayName
                        namespace = _ox.grafanaRoute.gatewayNamespace
                        sectionName = _ox.grafanaRoute.listener
                    }]
                    hostnames = _grafana_hosts
                    # Bitnami grafana Service: <release>-grafana, port 3000
                    rules = [{backendRefs = [{name = "${_release_name}-grafana", port = 3000}]}]
                }
            }) if _ox.grafanaEnabled and _grafana_hosts else None

            _alertmanager = _helm_release("alertmanager-release", "alertmanager", "alertmanager", "1.8.0", {
                replicaCount = _ox.alertmanagerReplicas
                persistence = {
                    enabled = True
                    size = "5Gi"
                    storageClassName = "rook-ceph-block"
                }
            }) if _ox.alertmanagerEnabled else None

            items = [r for r in [_namespace, _prometheus, _grafana, _grafana_route, _alertmanager] if r is not None]

    - step: automatically-detect-readiness
      functionRef:
        name: function-auto-ready
