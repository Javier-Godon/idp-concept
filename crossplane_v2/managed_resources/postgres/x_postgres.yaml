## PostgreSQL Composition — CloudNativePG (CNPG) operator pattern
##
## The composition creates the namespace, a CNPG `Cluster` (operator-native CRD, reconciled by
## CNPG into Pods, Services, PVCs and Secrets) and, only when `spec.nodePort` is set, a NodePort
## Service that selects the CNPG primary. Credentials are never rendered: the application role gets
## a generated `<cluster>-app` Secret, and an optional pre-created basic-auth Secret
## (`spec.superuserSecretName`) enables superuser access.
##
## Readiness: the Cluster Object is Ready only when status.readyInstances equals spec.instances.
##
## Prerequisites (cluster bootstrap, see docs/platform-engineering/PLATFORM_INSTALLATION.md):
##   - CNPG operator:  helm repo add cnpg https://cloudnative-pg.github.io/charts
##                     helm install cnpg cnpg/cloudnative-pg --version 0.29.1 -n cnpg-system --create-namespace
##   - provider-kubernetes with ProviderConfig `provider-kubernetes`
##   - function-kcl, function-auto-ready

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xpostgresinstance-cnpg-composition
  annotations:
    koncept.io/operator: "cloudnative-pg"
    koncept.io/pattern: "operator-native-crd"
    koncept.io/bridge-pattern: "false"
spec:
  compositeTypeRef:
    apiVersion: koncept.bluesolution.es/v1alpha1
    kind: XPostgresInstance
  mode: Pipeline
  pipeline:

    - step: render-resources
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            _params = option("params")
            _oxr = _params.oxr
            _ocds = _params.ocds or {}
            _ox = _oxr.spec
            _name = _ox.clusterName if _ox.clusterName else _oxr.metadata.name
            _ns = _ox.namespace

            _labels = {
                "app.kubernetes.io/name" = "postgresql"
                "app.kubernetes.io/instance" = _name
                "koncept.io/managed-by" = "crossplane"
                "koncept.io/environment" = _ox.environment
                if _ox.owner:
                    "koncept.io/owner" = _ox.owner
            }

            _object = lambda name: str, manifest: {str:}, extra: {str:} -> {str:} {
                {
                    apiVersion = "kubernetes.crossplane.io/v1alpha2"
                    kind = "Object"
                    metadata.annotations = {
                        "krm.kcl.dev/composition-resource-name" = name
                    }
                    spec = {
                        providerConfigRef.name = "provider-kubernetes"
                        forProvider.manifest = manifest
                    } | extra
                }
            }

            _is_ready = lambda name: str -> bool {
                _conditions = _ocds[name]?.Resource?.status?.conditions or []
                any c in _conditions {
                    c.type == "Ready" and c.status == "True"
                }
            }

            _namespace = _object("namespace", {
                apiVersion = "v1"
                kind = "Namespace"
                metadata = {
                    name = _ns
                    labels = _labels
                }
            }, {})

            _cluster = _object("cluster", {
                apiVersion = "postgresql.cnpg.io/v1"
                kind = "Cluster"
                metadata = {
                    name = _name
                    namespace = _ns
                    labels = _labels
                }
                spec = {
                    instances = _ox.instances
                    imageName = _ox.image
                    storage = {
                        size = _ox.storageSize
                        if _ox.storageClass:
                            storageClass = _ox.storageClass
                    }
                    resources = {
                        requests = {cpu = _ox.resourceCpuRequest, memory = _ox.resourceMemoryRequest}
                        limits = {cpu = _ox.resourceCpuLimit, memory = _ox.resourceMemoryLimit}
                    }
                    bootstrap.initdb = {
                        database = _ox.dbName
                        owner = _ox.ownerUsername if _ox.ownerUsername else _ox.dbName
                    }
                    if _ox.superuserSecretName:
                        enableSuperuserAccess = True
                        superuserSecret.name = _ox.superuserSecretName
                }
            }, {
                readiness = {
                    policy = "DeriveFromCelQuery"
                    celQuery = "has(object.status.readyInstances) && object.status.readyInstances == object.spec.instances"
                }
            })

            _nodeport_service = _object("nodeport-service", {
                apiVersion = "v1"
                kind = "Service"
                metadata = {
                    name = "${_name}-nodeport"
                    namespace = _ns
                    labels = _labels
                }
                spec = {
                    $type = "NodePort"
                    selector = {
                        "cnpg.io/cluster" = _name
                        "cnpg.io/instanceRole" = "primary"
                    }
                    ports = [{
                        name = "postgres"
                        port = 5432
                        targetPort = 5432
                        nodePort = _ox.nodePort
                    }]
                }
            }, {})

            # Create the operator CR only after the namespace exists; never drop it once composed,
            # otherwise Crossplane would delete it when the namespace Object flaps.
            _create = _is_ready("namespace") or "cluster" in _ocds
            _cluster_status = _ocds["cluster"]?.Resource?.status?.atProvider?.manifest?.status or {}

            _dxr = {
                **_params.dxr
                status = {
                    clusterName = _name
                    connectionSecretRef = "${_name}-app"
                    primaryEndpoint = "${_name}-rw.${_ns}.svc.cluster.local:5432"
                    readonlyEndpoint = "${_name}-ro.${_ns}.svc.cluster.local:5432"
                    readyInstances = _cluster_status.readyInstances or 0
                }
            }

            items = [_namespace, _dxr] + ([_cluster] + ([_nodeport_service] if _ox.nodePort else []) if _create else [])

    - step: automatically-detect-readiness
      functionRef:
        name: function-auto-ready
