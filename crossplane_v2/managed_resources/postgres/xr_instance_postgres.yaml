## PostgreSQL XR instance examples (cluster-scoped, platform-owned XRs)
##
## Production: HA cluster with backups-ready storage.
---
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XPostgresInstance
metadata:
  name: erp-back-postgres
spec:
  namespace: erp-back-data
  dbName: erp_back
  ownerUsername: erp_back
  instances: 3
  storageSize: "50Gi"
  storageClass: "fast-nvme"
  environment: production
  owner: erp-back-team
---
## Development / local single instance, reachable from outside the cluster on a NodePort.
## The superuser Secret (kubernetes.io/basic-auth, username "postgres") is created out of band:
##   kubectl -n erp-back-dev create secret generic erp-back-postgres-dev-superuser \
##     --type=kubernetes.io/basic-auth --from-literal=username=postgres --from-literal=password=<password>
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XPostgresInstance
metadata:
  name: erp-back-postgres-dev
spec:
  namespace: erp-back-dev
  dbName: erp_back
  instances: 1
  storageSize: "2Gi"
  superuserSecretName: erp-back-postgres-dev-superuser
  nodePort: 31543
  environment: development
  owner: erp-back-team
