apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xpostgresinstances.koncept.bluesolution.es
  annotations:
    koncept.io/tier: "2"
    koncept.io/operator: "cloudnative-pg"
    koncept.io/operator-version: "1.30.x"
    koncept.io/last-reviewed: "2026-10-10"
spec:
  scope: Cluster
  group: koncept.bluesolution.es
  names:
    kind: XPostgresInstance
    plural: xpostgresinstances
  defaultCompositionRef:
    name: xpostgresinstance-cnpg-composition
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: NAMESPACE
          type: string
          jsonPath: .spec.namespace
        - name: INSTANCES
          type: integer
          jsonPath: .spec.instances
        - name: STORAGE
          type: string
          jsonPath: .spec.storageSize
        - name: ENDPOINT
          type: string
          jsonPath: .status.primaryEndpoint
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self.nodePort == 0 || (self.nodePort >= 30000 && self.nodePort <= 32767)"
                  message: "nodePort must be 0 (disabled) or within the Kubernetes NodePort range 30000-32767"
              required:
                - namespace
                - dbName
              properties:
                namespace:
                  type: string
                  description: Namespace that holds the CNPG Cluster (created by the composition).
                clusterName:
                  type: string
                  default: ""
                  description: CNPG Cluster name. Defaults to the XR name.
                dbName:
                  type: string
                  pattern: "^[a-z][a-z0-9_]{0,62}$"
                  description: Database created by initdb.
                ownerUsername:
                  type: string
                  default: ""
                  description: Owner role of the database; its credentials live in the <cluster>-app Secret. Defaults to dbName.
                instances:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 9
                storageSize:
                  type: string
                  default: "10Gi"
                  pattern: "^[0-9]+(Mi|Gi|Ti)$"
                storageClass:
                  type: string
                  default: ""
                image:
                  type: string
                  default: "ghcr.io/cloudnative-pg/postgresql:18.4"
                  pattern: "^[a-z0-9/@:._-]+$"
                  description: CNPG-compatible PostgreSQL image (pinned tag).
                superuserSecretName:
                  type: string
                  default: ""
                  description: Name of an existing kubernetes.io/basic-auth Secret (username postgres) in the XR namespace. When set, superuser access is enabled with those credentials. The Secret is never rendered into Git.
                nodePort:
                  type: integer
                  default: 0
                  description: When non-zero, a NodePort Service exposes the primary on this node port (development clusters only).
                resourceCpuRequest:
                  type: string
                  default: "100m"
                resourceMemoryRequest:
                  type: string
                  default: "256Mi"
                resourceCpuLimit:
                  type: string
                  default: "1"
                resourceMemoryLimit:
                  type: string
                  default: "1Gi"
                environment:
                  type: string
                  default: production
                  enum:
                    - local
                    - development
                    - staging
                    - production
                owner:
                  type: string
                  default: ""
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                clusterName:
                  type: string
                connectionSecretRef:
                  type: string
                primaryEndpoint:
                  type: string
                readonlyEndpoint:
                  type: string
                readyInstances:
                  type: integer
