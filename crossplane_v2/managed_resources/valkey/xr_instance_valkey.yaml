## Valkey XR instance examples
---
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XValkeyInstance
metadata:
  name: app-cache-valkey
spec:
  namespace: app-cache
  clusterName: app-cache
  mode: standalone
  nodeCount: 1
  storageSize: "50Gi"
  storageClass: "fast-nvme"
  image: "valkey/valkey:8.1.10"
  resourceCpuRequest: "250m"
  resourceMemoryRequest: "512Mi"
  resourceCpuLimit: "1"
  resourceMemoryLimit: "2Gi"
  environment: production
  owner: app-team
---
## Replicated Valkey (1 primary + 2 replicas)
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XValkeyInstance
metadata:
  name: replicated-cache-valkey
spec:
  namespace: cache-system
  clusterName: replicated-cache
  mode: replication
  nodeCount: 3
  storageSize: "100Gi"
  storageClass: "fast-nvme"
  image: "valkey/valkey:8.1.10"
  resourceCpuRequest: "500m"
  resourceMemoryRequest: "1Gi"
  resourceCpuLimit: "2"
  resourceMemoryLimit: "4Gi"
  environment: production
  owner: cache-team
---
## Additional XR example (product-team usage; RBAC-scoped, not a Claim):
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XValkeyInstance
metadata:
  name: dev-cache
spec:
  namespace: dev-apps
  mode: standalone
  nodeCount: 1
  storageSize: "5Gi"
  image: "valkey/valkey:8.1.10"
  environment: development
  owner: dev-team
---
## Valkey with the Valkey Admin UI served at https://example.com/valkey-admin/ behind HTTP basic auth
## (the Secret needs an `.htpasswd` key and is created out of band).
apiVersion: koncept.bluesolution.es/v1alpha1
kind: XValkeyInstance
metadata:
  name: admin-cache
spec:
  namespace: admin-apps
  mode: standalone
  nodeCount: 1
  storageSize: "5Gi"
  image: "valkey/valkey:8.1.10"
  environment: development
  owner: dev-team
  adminUi:
    hostname: example.com
    path: /valkey-admin
    basicAuthSecretName: valkey-admin-basic-auth
