## Valkey Composition — OT-CONTAINER-KIT Operator pattern
##
## Valkey is a Redis-protocol-compatible open-source cache (BSD-3-Clause; forked from Redis
## after Redis's 2024 license change to SSPL/RSALv2).
##
## Operator choice: this composition reuses OT-CONTAINER-KIT/redis-operator (actively maintained —
## verify via github.com/OT-CONTAINER-KIT/redis-operator releases or quay.io/opstree/redis-operator
## tags, NOT its stale/abandoned Docker Hub mirror) rather than valkey-io/valkey-operator, the
## official Valkey project operator, because that operator's own README states it is still in
## "early development" and "not ready for production use" (pre-1.0 as of this writing). Valkey
## works with the Redis operator's `Redis`/`RedisCluster` CRDs via image substitution only — this
## is not officially documented/tested by the OT-CONTAINER-KIT maintainers for Valkey specifically,
## but is functionally sound since Valkey is wire/CLI-compatible with Redis OSS at the fork point.
## Revisit this choice once valkey-io/valkey-operator reaches a stable release.
##
## Prerequisite: OT-CONTAINER-KIT Redis Operator must be installed on the cluster.
## Install via Helm: helm repo add ot-helm https://ot-container-kit.github.io/helm-charts
##                  helm install redis-operator ot-helm/redis-operator -n redis-operator

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xvalkeyinstance-operator-composition
  annotations:
    koncept.io/operator: "ot-redis"
    koncept.io/pattern: "operator-native-crd"
    koncept.io/bridge-pattern: "false"
    koncept.io/note: "Valkey uses Redis-compatible operator (OT-CONTAINER-KIT). Mode selection (standalone vs cluster) is handled by function-kcl, which renders exactly one resource variant — function-patch-and-transform has no mechanism to conditionally exclude a resource."
spec:
  compositeTypeRef:
    apiVersion: koncept.bluesolution.es/v1alpha1
    kind: XValkeyInstance
  mode: Pipeline
  pipeline:

    - step: render-resources
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            _oxr = option("params").oxr
            _ox = _oxr.spec
            _base_name = _ox.clusterName if _ox.clusterName else _oxr.metadata.name

            _labels = {
                "koncept.io/managed-by" = "crossplane"
                "koncept.io/owner" = _ox.owner
            }

            _wrap = lambda name: str, manifest: {str:} -> {str:} {
                {
                    apiVersion = "kubernetes.crossplane.io/v1alpha2"
                    kind = "Object"
                    metadata.annotations = {
                        "krm.kcl.dev/composition-resource-name" = name
                    }
                    spec = {
                        providerConfigRef.name = "provider-kubernetes"
                        forProvider.manifest = manifest
                    }
                }
            }

            _namespace = _wrap("ns-valkey", {
                apiVersion = "v1"
                kind = "Namespace"
                metadata = {
                    name = _ox.namespace
                    labels = _labels
                }
            })

            _resources_spec = {
                requests = {
                    cpu = _ox.resourceCpuRequest
                    memory = _ox.resourceMemoryRequest
                }
                limits = {
                    cpu = _ox.resourceCpuLimit
                    memory = _ox.resourceMemoryLimit
                }
            }

            _vct_spec = {
                accessModes = ["ReadWriteOnce"]
                resources = {
                    requests = {
                        storage = _ox.storageSize
                    }
                }
            } | ({storageClassName = _ox.storageClass} if _ox.storageClass else {})

            _standalone = _wrap("valkey-standalone", {
                apiVersion = "redis.redis.opstreelabs.in/v1beta2"
                kind = "Redis"
                metadata = {
                    name = _base_name
                    namespace = _ox.namespace
                    labels = _labels
                }
                spec = {
                    image = _ox.image
                    storage.image.tag = "latest"
                    volumeClaimTemplate.spec = _vct_spec
                    resources = _resources_spec
                }
            }) if _ox.mode == "standalone" else None

            _cluster = _wrap("valkey-cluster", {
                apiVersion = "redis.redis.opstreelabs.in/v1beta2"
                kind = "RedisCluster"
                metadata = {
                    name = "${_base_name}-cluster"
                    namespace = _ox.namespace
                    labels = _labels
                }
                spec = {
                    image = _ox.image
                    clusterSize = _ox.nodeCount
                    volumeClaimTemplate.spec = _vct_spec
                    resources = _resources_spec
                }
            }) if _ox.mode == "cluster" else None

            items = [r for r in [_namespace, _standalone, _cluster] if r is not None]

    - step: automatically-detect-readiness
      functionRef:
        name: function-auto-ready

    - step: sequence-creation
      functionRef:
        name: function-sequencer
      input:
        apiVersion: sequencer.fn.crossplane.io/v1beta1
        kind: Input
        rules:
          - sequence:
              - ns-valkey
              - valkey-standalone
          - sequence:
              - ns-valkey
              - valkey-cluster
