## Valkey Composition — OT-CONTAINER-KIT redis-operator pattern
##
## Valkey is a Redis-protocol-compatible open-source cache (BSD-3-Clause; forked from Redis
## after Redis's 2024 license change to SSPL/RSALv2).
##
## Operator choice: OT-CONTAINER-KIT/redis-operator (quay.io/opstree/redis-operator) rather than
## valkey-io/valkey-operator, which its README still describes as early development. The operator's
## `Redis` (standalone) and `RedisReplication` CRDs run the stock `valkey/valkey` image unchanged
## (verified on operator v0.26.0 with valkey/valkey:8.1.10: PING, persistence, replica link up).
## `RedisCluster` is intentionally NOT offered: it relies on the opstree image entrypoint to set
## `cluster-enabled yes`, so with the stock Valkey image pods turn Ready but the cluster never forms.
##
## Readiness: the operator CRs expose no Ready condition, so an observe-only Object watches the
## StatefulSet the operator creates and is Ready only when all replicas are ready.
##
## Prerequisites (cluster bootstrap, see crossplane_v2/functions and providers):
##   - redis-operator:  helm repo add ot-helm https://ot-container-kit.github.io/helm-charts
##                      helm install redis-operator ot-helm/redis-operator --version 0.26.1 -n redis-operator --create-namespace
##   - provider-kubernetes with ProviderConfig `provider-kubernetes`
##   - function-kcl, function-auto-ready
##   - optional adminUi (Valkey Admin): Envoy Gateway (HTTPRoute + SecurityPolicy CRDs) and the platform Gateway;
##     the basicAuthSecretName Secret (`.htpasswd` key) is created out of band in the Valkey namespace

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xvalkeyinstance-operator-composition
  annotations:
    koncept.io/operator: "ot-redis"
    koncept.io/pattern: "operator-native-crd"
    koncept.io/bridge-pattern: "false"
spec:
  compositeTypeRef:
    apiVersion: koncept.bluesolution.es/v1alpha1
    kind: XValkeyInstance
  mode: Pipeline
  pipeline:

    - step: render-resources
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            _params = option("params")
            _oxr = _params.oxr
            _ocds = _params.ocds or {}
            _ox = _oxr.spec
            _name = _ox.clusterName if _ox.clusterName else _oxr.metadata.name
            _ns = _ox.namespace
            _is_replication = _ox.mode == "replication"

            _labels = {
                "app.kubernetes.io/name" = "valkey"
                "app.kubernetes.io/instance" = _name
                "koncept.io/managed-by" = "crossplane"
                "koncept.io/environment" = _ox.environment
                if _ox.owner:
                    "koncept.io/owner" = _ox.owner
            }

            _object = lambda name: str, manifest: {str:}, extra: {str:} -> {str:} {
                {
                    apiVersion = "kubernetes.crossplane.io/v1alpha2"
                    kind = "Object"
                    metadata.annotations = {
                        "krm.kcl.dev/composition-resource-name" = name
                    }
                    spec = {
                        providerConfigRef.name = "provider-kubernetes"
                        forProvider.manifest = manifest
                    } | extra
                }
            }

            _is_ready = lambda name: str -> bool {
                _conditions = _ocds[name]?.Resource?.status?.conditions or []
                any c in _conditions {
                    c.type == "Ready" and c.status == "True"
                }
            }

            _namespace = _object("namespace", {
                apiVersion = "v1"
                kind = "Namespace"
                metadata = {
                    name = _ns
                    labels = _labels
                }
            }, {})

            _spec = {
                kubernetesConfig = {
                    image = _ox.image
                    imagePullPolicy = "IfNotPresent"
                    resources = {
                        requests = {cpu = _ox.resourceCpuRequest, memory = _ox.resourceMemoryRequest}
                        limits = {cpu = _ox.resourceCpuLimit, memory = _ox.resourceMemoryLimit}
                    }
                }
                storage.volumeClaimTemplate.spec = {
                    accessModes = ["ReadWriteOnce"]
                    resources.requests.storage = _ox.storageSize
                    if _ox.storageClass:
                        storageClassName = _ox.storageClass
                }
                # valkey/valkey runs as uid/gid 999 and skips its root-only chown step when non-root.
                podSecurityContext = {
                    runAsNonRoot = True
                    runAsUser = 999
                    runAsGroup = 999
                    fsGroup = 999
                    seccompProfile.$type = "RuntimeDefault"
                }
                securityContext = {
                    allowPrivilegeEscalation = False
                    capabilities.drop = ["ALL"]
                }
                if _is_replication:
                    clusterSize = _ox.nodeCount
            }

            _valkey = _object("valkey", {
                apiVersion = "redis.redis.opstreelabs.in/v1beta2"
                kind = "RedisReplication" if _is_replication else "Redis"
                metadata = {
                    name = _name
                    namespace = _ns
                    labels = _labels
                }
                spec = _spec
            }, {})

            _statefulset = _object("statefulset", {
                apiVersion = "apps/v1"
                kind = "StatefulSet"
                metadata = {
                    name = _name
                    namespace = _ns
                }
            }, {
                managementPolicies = ["Observe"]
                readiness = {
                    policy = "DeriveFromCelQuery"
                    celQuery = "has(object.status.readyReplicas) && object.status.readyReplicas == object.spec.replicas"
                }
            })

            # Create the operator CR only after the namespace exists; never drop it once composed,
            # otherwise Crossplane would delete it when the namespace Object flaps.
            _create_valkey = _is_ready("namespace") or "valkey" in _ocds
            _sts_status = _ocds["statefulset"]?.Resource?.status?.atProvider?.manifest?.status or {}

            # Optional Valkey Admin UI (https://github.com/valkey-io/valkey-admin): Deployment + Service, plus an
            # HTTPRoute on the platform gateway (sub-path of a shared hostname) and an Envoy Gateway basic-auth
            # SecurityPolicy. The UI has no authentication of its own; the CRDs come from Envoy Gateway.
            _admin = _ox.adminUi or {}
            _admin_name = "${_name}-admin"
            _admin_port = 8080
            _admin_host = _admin?.hostname or ""
            _admin_labels = _labels | {
                "app.kubernetes.io/name" = "valkey-admin"
                "app" = _admin_name
            }

            _admin_env = [
                {name = "DEPLOYMENT_MODE", value = "Web"}
                {name = "PORT", value = str(_admin_port)}
                {name = "VALKEY_HOST", value = "${_name}.${_ns}.svc.cluster.local"}
                {name = "VALKEY_PORT", value = "6379"}
                if _admin?.passwordSecretName:
                    {
                        name = "VALKEY_PASSWORD"
                        valueFrom.secretKeyRef = {name = _admin.passwordSecretName, key = _admin.passwordSecretKey}
                    }
                # Web mode only accepts same-origin WebSocket handshakes; name the public origin explicitly.
                if _admin_host:
                    {name = "VALKEY_ADMIN_ALLOWED_WS_ORIGINS", value = "${_admin.listener}://${_admin_host}"}
            ]

            _admin_deployment = _object("admin-deployment", {
                apiVersion = "apps/v1"
                kind = "Deployment"
                metadata = {
                    name = _admin_name
                    namespace = _ns
                    labels = _admin_labels
                }
                spec = {
                    # Metrics collectors and sessions live in the process: not horizontally scalable.
                    replicas = 1
                    selector.matchLabels = {app = _admin_name}
                    template = {
                        metadata.labels = _admin_labels
                        spec = {
                            # The image runs as the non-root `node` user (uid 1000).
                            securityContext = {
                                runAsNonRoot = True
                                runAsUser = 1000
                                runAsGroup = 1000
                                seccompProfile.$type = "RuntimeDefault"
                            }
                            containers = [{
                                name = _admin_name
                                image = _admin.image
                                imagePullPolicy = "IfNotPresent"
                                ports = [{containerPort = _admin_port}]
                                env = _admin_env
                                # Web mode: ~1GB for the UI plus ~150MB per primary metrics collector.
                                resources = {
                                    requests = {cpu = "100m", memory = "512Mi"}
                                    limits = {cpu = "1", memory = "1536Mi"}
                                }
                                livenessProbe = {
                                    httpGet = {path = "/", port = _admin_port}
                                    initialDelaySeconds = 30
                                    periodSeconds = 10
                                }
                                readinessProbe = {
                                    httpGet = {path = "/", port = _admin_port}
                                    initialDelaySeconds = 10
                                    periodSeconds = 5
                                }
                                securityContext = {
                                    allowPrivilegeEscalation = False
                                    capabilities.drop = ["ALL"]
                                }
                            }]
                        }
                    }
                }
            }, {})

            _admin_service = _object("admin-service", {
                apiVersion = "v1"
                kind = "Service"
                metadata = {
                    name = _admin_name
                    namespace = _ns
                    labels = _admin_labels
                }
                spec = {
                    selector = {app = _admin_name}
                    ports = [{name = "http", port = _admin_port, targetPort = _admin_port}]
                    $type = "ClusterIP"
                }
            }, {})

            # Same shape as framework/builders/route.k (trailingSlashRedirect + rewritePrefix "/"): the UI loads
            # assets with relative URLs, uses a HashRouter and derives its WebSocket URL from location.pathname.
            _admin_route = _object("admin-route", {
                apiVersion = "gateway.networking.k8s.io/v1"
                kind = "HTTPRoute"
                metadata = {
                    name = _admin_name
                    namespace = _ns
                    labels = _admin_labels
                }
                spec = {
                    parentRefs = [{
                        name = _admin?.gatewayName
                        namespace = _admin?.gatewayNamespace
                        sectionName = _admin?.listener
                    }]
                    hostnames = [_admin_host]
                    rules = [
                        {
                            matches = [{path = {$type = "Exact", value = _admin?.path}}]
                            filters = [{
                                $type = "RequestRedirect"
                                requestRedirect = {
                                    path = {$type = "ReplaceFullPath", replaceFullPath = "${_admin?.path}/"}
                                    statusCode = 301
                                }
                            }]
                        }
                        {
                            matches = [{path = {$type = "PathPrefix", value = _admin?.path}}]
                            backendRefs = [{name = _admin_name, port = _admin_port}]
                            filters = [{
                                $type = "URLRewrite"
                                urlRewrite.path = {$type = "ReplacePrefixMatch", replacePrefixMatch = "/"}
                            }]
                        }
                    ]
                }
            }, {})

            _admin_policy = _object("admin-security-policy", {
                apiVersion = "gateway.envoyproxy.io/v1alpha1"
                kind = "SecurityPolicy"
                metadata = {
                    name = _admin_name
                    namespace = _ns
                    labels = _admin_labels
                }
                spec = {
                    targetRefs = [{group = "gateway.networking.k8s.io", kind = "HTTPRoute", name = _admin_name}]
                    basicAuth.users.name = _admin?.basicAuthSecretName
                }
            }, {})

            _admin_items = [_admin_deployment, _admin_service] + ([_admin_route] if _admin_host else []) + ([_admin_policy] if _admin_host and _admin?.basicAuthSecretName else [])

            _dxr = {
                **_params.dxr
                status = {
                    clusterName = _name
                    serviceEndpoint = "${_name}.${_ns}.svc.cluster.local:6379"
                    readyNodes = _sts_status.readyReplicas or 0
                    adminUrl = "${_admin.listener}://${_admin_host}${_admin.path}/" if _admin_host else ""
                }
            }

            items = [_namespace, _dxr] + ([_valkey, _statefulset] if _create_valkey else []) + (_admin_items if _ox.adminUi and _create_valkey else [])

    - step: automatically-detect-readiness
      functionRef:
        name: function-auto-ready
