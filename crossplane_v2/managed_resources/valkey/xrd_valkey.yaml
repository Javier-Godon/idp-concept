apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xvalkeyinstances.koncept.bluesolution.es
  annotations:
    koncept.io/tier: "2"
    koncept.io/operator: "ot-redis"
    koncept.io/operator-version: "0.26.x"
    koncept.io/last-reviewed: "2026-10-09"
    koncept.io/note: "Valkey on the OT-CONTAINER-KIT Redis Operator with the stock valkey/valkey image. Only standalone and replication are offered: RedisCluster needs the opstree image entrypoint to enable cluster mode."
spec:
  scope: Cluster
  group: koncept.bluesolution.es
  names:
    kind: XValkeyInstance
    plural: xvalkeyinstances
  defaultCompositionRef:
    name: xvalkeyinstance-operator-composition
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: NAMESPACE
          type: string
          jsonPath: .spec.namespace
        - name: MODE
          type: string
          jsonPath: .spec.mode
          description: standalone or replication
        - name: SIZE
          type: integer
          jsonPath: .spec.nodeCount
          description: Number of nodes
        - name: STORAGE
          type: string
          jsonPath: .spec.storageSize
        - name: ENDPOINT
          type: string
          jsonPath: .status.serviceEndpoint
        - name: ADMIN
          type: string
          jsonPath: .status.adminUrl
        - name: READY
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: Valkey instance (Redis-compatible cache) via the OT redis-operator.
              x-kubernetes-validations:
                - rule: "self.mode != 'replication' || self.nodeCount >= 2"
                  message: "replication mode requires nodeCount >= 2"
                - rule: "!has(self.adminUi) || self.adminUi.hostname == '' || self.environment in ['local', 'development'] || self.adminUi.basicAuthSecretName != ''"
                  message: "staging/production adminUi published on a hostname requires basicAuthSecretName (Valkey Admin has no built-in authentication)"
              required:
                - namespace
                - mode
              properties:
                namespace:
                  type: string
                  description: Kubernetes namespace where Valkey runs.
                clusterName:
                  type: string
                  description: Name of the operator Redis/RedisReplication resource and its Service (XR name if unset).
                  default: ""
                mode:
                  type: string
                  description: "standalone = one node; replication = one primary plus (nodeCount - 1) replicas."
                  enum:
                    - standalone
                    - replication
                  default: standalone
                nodeCount:
                  type: integer
                  description: "Total nodes in replication mode (primary + replicas, 2+). Ignored in standalone mode."
                  default: 2
                  minimum: 1
                  maximum: 9
                storageSize:
                  type: string
                  description: PVC storage size per node (e.g., 10Gi, 100Gi).
                  default: "10Gi"
                  pattern: "^[0-9]+(Mi|Gi|Ti)$"
                storageClass:
                  type: string
                  description: StorageClass name. Leave empty for the cluster default.
                  default: ""
                image:
                  type: string
                  description: Valkey Docker image to use.
                  default: "valkey/valkey:8.1.10"
                  pattern: "^[a-z0-9/@:._-]+$"
                resourceCpuRequest:
                  type: string
                  description: CPU request per Valkey pod.
                  default: "100m"
                resourceMemoryRequest:
                  type: string
                  description: Memory request per Valkey pod.
                  default: "256Mi"
                resourceCpuLimit:
                  type: string
                  description: CPU limit per Valkey pod.
                  default: "1"
                resourceMemoryLimit:
                  type: string
                  description: Memory limit per Valkey pod.
                  default: "2Gi"
                environment:
                  type: string
                  description: "Target environment tier: local, development, staging, production."
                  default: production
                  enum:
                    - local
                    - development
                    - staging
                    - production
                owner:
                  type: string
                  description: "Team or system that owns this instance (for labeling/RBAC)."
                  default: ""
                adminUi:
                  type: object
                  description: >-
                    Optional Valkey Admin web UI (https://github.com/valkey-io/valkey-admin) preconfigured for this instance.
                    Valkey Admin has no built-in authentication: when published on a hostname, protect it with
                    basicAuthSecretName (Envoy Gateway basic auth). Omit the block to deploy no UI.
                  properties:
                    image:
                      type: string
                      description: Valkey Admin image (pinned tag, never latest).
                      default: "valkey/valkey-admin:1.2.0"
                      pattern: "^[a-z0-9/@:._-]+$"
                    hostname:
                      type: string
                      description: >-
                        Bare public hostname (no scheme, path or port) the UI is published on through the platform gateway.
                        Empty = cluster-internal Service only.
                      default: ""
                      pattern: "^[a-zA-Z0-9.-]*$"
                    path:
                      type: string
                      description: Sub-path of the hostname the UI is served under (the route strips it and redirects <path> to <path>/).
                      default: /valkey-admin
                      pattern: "^/[a-zA-Z0-9._~-]+(/[a-zA-Z0-9._~-]+)*$"
                    listener:
                      type: string
                      description: Gateway listener the route attaches to (https = TLS hostnames).
                      enum:
                        - https
                        - http
                      default: https
                    gatewayName:
                      type: string
                      description: Platform Gateway name.
                      default: platform-gateway
                    gatewayNamespace:
                      type: string
                      description: Platform Gateway namespace.
                      default: gateway-system
                    basicAuthSecretName:
                      type: string
                      description: >-
                        Name of a Secret in the Valkey namespace with an `.htpasswd` key (SHA hashes) enforced on the route by an
                        Envoy Gateway SecurityPolicy. Created out of band; never rendered.
                      default: ""
                    passwordSecretName:
                      type: string
                      description: Optional Secret with the Valkey password, passed to the UI as VALKEY_PASSWORD.
                      default: ""
                    passwordSecretKey:
                      type: string
                      description: Key of passwordSecretName holding the password.
                      default: password
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                clusterName:
                  type: string
                  description: The name of the generated Redis/RedisReplication resource.
                readyNodes:
                  type: integer
                  description: Number of Valkey nodes currently Ready.
                serviceEndpoint:
                  type: string
                  description: Service endpoint for Valkey connections.
                adminUrl:
                  type: string
                  description: Public URL of the Valkey Admin UI (empty when not published).

