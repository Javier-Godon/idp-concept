apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cert-parser
  namespace: cert-parser
  labels:
    app: cert-parser
spec:
  parentRefs:
    - name: platform-gateway
      namespace: gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /prt-cert-parser
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: cert-parser
          port: 8000
