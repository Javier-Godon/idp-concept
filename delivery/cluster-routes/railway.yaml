apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: railway
  namespace: railroad
  labels:
    app: railway-app
spec:
  parentRefs:
    - name: platform-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - railway.es
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: railway-service
          port: 8089
